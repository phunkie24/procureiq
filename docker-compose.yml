services:

  # ── MongoDB ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: procureiq

  # ── ChromaDB (vector store / RAG) ───────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8001:8000"         # host:8001 → container:8000
    volumes:
      - chroma_data:/chroma/chroma

  # ── Python agent backend ─────────────────────────────────────
  agents:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Override port to internal container port (8000), not the host-mapped 8001
      PROCUREMENT_CHROMA_HOST: chromadb
      PROCUREMENT_CHROMA_PORT: "8000"
    depends_on:
      - chromadb

  # ── Express API + Socket.io ──────────────────────────────────
  api:
    build: ./frontend/server
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file: ./frontend/server/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost
      MONGODB_URI: mongodb://mongodb:27017/procureiq
    depends_on:
      - mongodb

  # ── React client (nginx) ─────────────────────────────────────
  client:
    build: ./frontend/client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mongo_data:
  chroma_data:
